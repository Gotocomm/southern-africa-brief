name: Publish episode

on:
  push:
    branches: [main]
    paths: ["episodes/**", "podcast.json", "cover.jpg", "tools/**", ".github/workflows/publish.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the voice tools
        run: pip install -r tools/requirements.txt

      - name: Make audio and rebuild the feed
        run: |
          set +e
          python3 tools/build.py
          code=$?
          if [ $code -ne 0 ]; then echo "BUILD_FAILED=$code" >> "$GITHUB_ENV"; fi
          if [ $code -ne 0 ] && [ $code -ne 3 ]; then exit $code; fi

      - name: Save new audio to the repository
        run: |
          git config user.name "Southern Africa Brief"
          git config user.email "admin@namela.org"
          git add site/audio
          if ! git diff --cached --quiet; then
            git commit -m "Audio for $(date -u +%F) [skip ci]"
            git push
          fi

      - name: Publish the website and feed (gh-pages branch)
        run: |
          rm -rf /tmp/pages && cp -r site /tmp/pages && touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git init -q -b gh-pages
          git config user.name "Southern Africa Brief"
          git config user.email "admin@namela.org"
          git add -A
          git commit -qm "Site for $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Report scripts that could not be published
        if: env.BUILD_FAILED != ''
        run: |
          echo "One or more episode scripts failed the checks. See the 'Make audio' step above." >&2
          exit 1
